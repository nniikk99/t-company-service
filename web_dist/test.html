<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Telegram Mini App Test</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
        }
        .status {
            background: var(--tg-theme-secondary-bg-color, #f4f4f5);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .success {
            color: var(--tg-theme-link-color, #3390ec);
        }
        .error {
            color: #e53935;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Telegram Mini App Test</h1>
        
        <div class="status">
            <h3>Telegram WebApp Status:</h3>
            <div id="tg-status">Checking...</div>
        </div>
        
        <div class="status">
            <h3>User Info:</h3>
            <div id="user-info">Loading...</div>
        </div>
        
        <div class="status">
            <h3>Theme Info:</h3>
            <div id="theme-info">Loading...</div>
        </div>
        
        <div class="status">
            <h3>JavaScript Test:</h3>
            <div id="js-test">✅ JavaScript is working!</div>
        </div>
    </div>

    <script>
        // Initialize Telegram WebApp
        const tg = window.Telegram.WebApp;
        
        // Expand to full height
        tg.expand();
        
        // Set up main button
        tg.MainButton.setText("Закрыть");
        tg.MainButton.show();
        tg.MainButton.onClick(() => {
            tg.close();
        });
        
        // Check Telegram WebApp status
        const statusDiv = document.getElementById('tg-status');
        if (tg.initData) {
            statusDiv.innerHTML = '<span class="success">✅ Telegram WebApp is working!</span>';
        } else {
            statusDiv.innerHTML = '<span class="error">❌ Telegram WebApp not detected</span>';
        }
        
        // Get user info
        const userInfoDiv = document.getElementById('user-info');
        const user = tg.initDataUnsafe?.user;
        if (user) {
            userInfoDiv.innerHTML = `
                <strong>Name:</strong> ${user.first_name} ${user.last_name || ''}<br>
                <strong>Username:</strong> @${user.username || 'N/A'}<br>
                <strong>ID:</strong> ${user.id}
            `;
        } else {
            userInfoDiv.innerHTML = '<span class="error">❌ No user data available</span>';
        }
        
        // Get theme info
        const themeInfoDiv = document.getElementById('theme-info');
        const themeParams = tg.themeParams;
        if (themeParams) {
            themeInfoDiv.innerHTML = `
                <strong>Background:</strong> ${themeParams.bg_color || 'N/A'}<br>
                <strong>Text:</strong> ${themeParams.text_color || 'N/A'}<br>
                <strong>Button:</strong> ${themeParams.button_color || 'N/A'}
            `;
        } else {
            themeInfoDiv.innerHTML = '<span class="error">❌ No theme data available</span>';
        }
        
        // Test if we can access the main app
        setTimeout(() => {
            const jsTestDiv = document.getElementById('js-test');
            jsTestDiv.innerHTML += '<br>✅ All tests completed successfully!';
        }, 1000);
    </script>
</body>
</html>
