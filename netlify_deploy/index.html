<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="telegram-web-app" content="true">
  <meta name="telegram-web-app-version" content="9.1">
  <title>T-Company Service</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-color: #4285F4;
      --primary-variant: #1565C0;
      --secondary-color: #00BCD4;
      --accent-color: #FF6B6B;
      --success-color: #4CAF50;
      --warning-color: #FF9800;
      --error-color: #F44336;
      --bg-light: #F8F9FA;
      --surface-light: #FFFFFF;
      --text-primary: #212529;
      --text-secondary: #6C757D;
      --divider: #E9ECEF;
      --tg-theme-bg: var(--tg-theme-bg-color, #FFFFFF);
      --tg-theme-text: var(--tg-theme-text-color, #212529);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--tg-theme-bg);
      color: var(--tg-theme-text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      max-width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .app-header {
      background: linear-gradient(135deg, var(--primary-color), var(--primary-variant));
      color: white;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }

    .header-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .header-subtitle {
      font-size: 14px;
      opacity: 0.9;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }

    /* Auth Screen */
    .auth-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 100px);
      padding: 20px;
    }

    .auth-logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-variant));
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: white;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(66, 133, 244, 0.3);
    }

    .auth-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .auth-subtitle {
      font-size: 16px;
      color: var(--text-secondary);
      margin-bottom: 32px;
      text-align: center;
    }

    .form-group {
      width: 100%;
      max-width: 400px;
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      border: 1px solid rgba(0,0,0,0.15);
      border-radius: 16px;
      background: rgba(0,0,0,0.02);
      transition: all 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary-color);
      background: white;
      box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.1);
    }

    .btn {
      width: 100%;
      max-width: 400px;
      padding: 16px 24px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--primary-color);
      color: white;
      box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-variant);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(66, 133, 244, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: transparent;
      color: var(--primary-color);
      border: 2px solid var(--primary-color);
    }

    /* Cards */
    .card {
      background: var(--surface-light);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      border: 1px solid var(--divider);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .card-body {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* Status Badges */
    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-success {
      background: rgba(76, 175, 80, 0.15);
      color: var(--success-color);
    }

    .badge-warning {
      background: rgba(255, 152, 0, 0.15);
      color: var(--warning-color);
    }

    .badge-error {
      background: rgba(244, 67, 54, 0.15);
      color: var(--error-color);
    }

    .badge-info {
      background: rgba(33, 150, 243, 0.15);
      color: #2196F3;
    }

    /* Bottom Navigation */
    .bottom-nav {
      display: flex;
      background: var(--surface-light);
      border-top: 1px solid var(--divider);
      padding: 8px;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.05);
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      color: var(--text-secondary);
    }

    .nav-item.active {
      background: rgba(66, 133, 244, 0.1);
      color: var(--primary-color);
    }

    .nav-icon {
      font-size: 24px;
      margin-bottom: 4px;
    }

    .nav-label {
      font-size: 12px;
      font-weight: 600;
    }

    /* Loading */
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Hidden */
    .hidden {
      display: none !important;
    }

    /* Error Message */
    .error-message {
      background: rgba(244, 67, 54, 0.1);
      color: var(--error-color);
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.3;
    }

    .empty-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .empty-text {
      font-size: 14px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="app-container" id="app">
    <!-- Контент будет загружен через JavaScript -->
  </div>

  <script>
    // Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Supabase
    const supabase = supabase.createClient(
      'https://kwunhuzfnjpcoeusnxzy.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3dW5odXpmbmpwY29ldXNueHp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQwNDM2MTksImV4cCI6MjA1OTYxOTYxOX0.2ppg8GtsGKE-ACMC__jSTy0gmn7eUya2xHagi9cdypE'
    );

    // State
    let currentUser = null;
    let currentView = 'auth';

    // Initialize App
    async function initApp() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        currentUser = session.user;
        showRequestsView();
      } else {
        showAuthView();
      }
    }

    // Auth View
    function showAuthView() {
      currentView = 'auth';
      document.getElementById('app').innerHTML = `
        <div class="auth-screen">
          <div class="auth-logo">🏢</div>
          <h1 class="auth-title">T-Co Service</h1>
          <p class="auth-subtitle">Система управления сервисными заявками</p>
          
          <div id="error-container"></div>
          
          <div class="form-group">
            <label class="form-label">Номер телефона</label>
            <input 
              type="tel" 
              class="form-input" 
              id="phone-input" 
              placeholder="+7 (___) ___-__-__"
              maxlength="18"
            >
          </div>
          
          <div class="form-group">
            <label class="form-label">Пароль</label>
            <input 
              type="password" 
              class="form-input" 
              id="password-input" 
              placeholder="Введите пароль"
            >
          </div>
          
          <button class="btn btn-primary" id="login-btn">
            <span id="login-text">Войти</span>
            <span class="loading hidden" id="login-loading"></span>
          </button>
        </div>
      `;

      // Phone mask
      const phoneInput = document.getElementById('phone-input');
      phoneInput.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, '');
        if (value.startsWith('8')) value = '7' + value.slice(1);
        if (!value.startsWith('7')) value = '7' + value;
        
        let formatted = '+7';
        if (value.length > 1) {
          formatted += ' (' + value.slice(1, 4);
        }
        if (value.length >= 5) {
          formatted += ') ' + value.slice(4, 7);
        }
        if (value.length >= 8) {
          formatted += '-' + value.slice(7, 9);
        }
        if (value.length >= 10) {
          formatted += '-' + value.slice(9, 11);
        }
        
        e.target.value = formatted;
      });

      // Login handler
      document.getElementById('login-btn').addEventListener('click', handleLogin);
      document.getElementById('password-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleLogin();
      });
    }

    async function handleLogin() {
      const phone = document.getElementById('phone-input').value.replace(/\D/g, '');
      const password = document.getElementById('password-input').value;
      const errorContainer = document.getElementById('error-container');
      const loginBtn = document.getElementById('login-btn');
      const loginText = document.getElementById('login-text');
      const loginLoading = document.getElementById('login-loading');

      errorContainer.innerHTML = '';

      if (phone.length !== 11) {
        showError('Введите корректный номер телефона');
        return;
      }

      if (!password) {
        showError('Введите пароль');
        return;
      }

      loginBtn.disabled = true;
      loginText.classList.add('hidden');
      loginLoading.classList.remove('hidden');

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: `${phone}@t-company.local`,
          password: password
        });

        if (error) throw error;

        currentUser = data.user;
        showRequestsView();
      } catch (error) {
        showError('Неверный телефон или пароль');
        loginBtn.disabled = false;
        loginText.classList.remove('hidden');
        loginLoading.classList.add('hidden');
      }
    }

    function showError(message) {
      document.getElementById('error-container').innerHTML = `
        <div class="error-message">${message}</div>
      `;
    }

    // Requests View
    async function showRequestsView() {
      currentView = 'requests';
      document.getElementById('app').innerHTML = `
        <div class="app-header">
          <div class="header-title">Заявки</div>
          <div class="header-subtitle">Текущие сервисные заявки</div>
        </div>
        <div class="main-content" id="requests-content">
          <div class="empty-state">
            <div class="loading" style="width: 40px; height: 40px; border-width: 4px; border-top-color: var(--primary-color); border-color: var(--divider);"></div>
          </div>
        </div>
        <div class="bottom-nav">
          <div class="nav-item active" onclick="showRequestsView()">
            <div class="nav-icon">📋</div>
            <div class="nav-label">Заявки</div>
          </div>
          <div class="nav-item" onclick="showEngineersView()">
            <div class="nav-icon">👷</div>
            <div class="nav-label">Инженеры</div>
          </div>
          <div class="nav-item" onclick="showEquipmentView()">
            <div class="nav-icon">🔧</div>
            <div class="nav-label">Оборудование</div>
          </div>
          <div class="nav-item" onclick="showProfileView()">
            <div class="nav-icon">👤</div>
            <div class="nav-label">Профиль</div>
          </div>
        </div>
      `;

      loadRequests();
    }

    async function loadRequests() {
      try {
        const { data, error } = await supabase
          .from('service_requests')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(50);

        if (error) throw error;

        const content = document.getElementById('requests-content');
        
        if (data.length === 0) {
          content.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">📋</div>
              <div class="empty-title">Нет заявок</div>
              <div class="empty-text">Заявки появятся здесь</div>
            </div>
          `;
        } else {
          content.innerHTML = data.map(request => `
            <div class="card">
              <div class="card-header">
                <div class="card-title">#${request.id} - ${request.site_name || 'Объект'}</div>
                <span class="badge badge-${getStatusBadge(request.status)}">${getStatusText(request.status)}</span>
              </div>
              <div class="card-body">
                <div><strong>Адрес:</strong> ${request.site_address || 'Не указан'}</div>
                <div><strong>Оборудование:</strong> ${request.equipment_type || 'Не указано'}</div>
                <div><strong>Описание:</strong> ${request.description || 'Нет описания'}</div>
              </div>
            </div>
          `).join('');
        }
      } catch (error) {
        document.getElementById('requests-content').innerHTML = `
          <div class="error-message">Ошибка загрузки заявок</div>
        `;
      }
    }

    function getStatusBadge(status) {
      const map = {
        'new': 'info',
        'assigned': 'warning',
        'in_progress': 'warning',
        'completed': 'success',
        'cancelled': 'error'
      };
      return map[status] || 'info';
    }

    function getStatusText(status) {
      const map = {
        'new': 'Новая',
        'assigned': 'Назначена',
        'in_progress': 'В работе',
        'completed': 'Завершена',
        'cancelled': 'Отменена'
      };
      return map[status] || status;
    }

    // Engineers View
    function showEngineersView() {
      document.getElementById('app').innerHTML = `
        <div class="app-header">
          <div class="header-title">Инженеры</div>
          <div class="header-subtitle">Список инженеров</div>
        </div>
        <div class="main-content">
          <div class="empty-state">
            <div class="empty-icon">👷</div>
            <div class="empty-title">Функция в разработке</div>
            <div class="empty-text">Скоро здесь будет список инженеров</div>
          </div>
        </div>
        <div class="bottom-nav">
          <div class="nav-item" onclick="showRequestsView()">
            <div class="nav-icon">📋</div>
            <div class="nav-label">Заявки</div>
          </div>
          <div class="nav-item active" onclick="showEngineersView()">
            <div class="nav-icon">👷</div>
            <div class="nav-label">Инженеры</div>
          </div>
          <div class="nav-item" onclick="showEquipmentView()">
            <div class="nav-icon">🔧</div>
            <div class="nav-label">Оборудование</div>
          </div>
          <div class="nav-item" onclick="showProfileView()">
            <div class="nav-icon">👤</div>
            <div class="nav-label">Профиль</div>
          </div>
        </div>
      `;
    }

    // Equipment View
    function showEquipmentView() {
      document.getElementById('app').innerHTML = `
        <div class="app-header">
          <div class="header-title">Оборудование</div>
          <div class="header-subtitle">Список оборудования</div>
        </div>
        <div class="main-content">
          <div class="empty-state">
            <div class="empty-icon">🔧</div>
            <div class="empty-title">Функция в разработке</div>
            <div class="empty-text">Скоро здесь будет список оборудования</div>
          </div>
        </div>
        <div class="bottom-nav">
          <div class="nav-item" onclick="showRequestsView()">
            <div class="nav-icon">📋</div>
            <div class="nav-label">Заявки</div>
          </div>
          <div class="nav-item" onclick="showEngineersView()">
            <div class="nav-icon">👷</div>
            <div class="nav-label">Инженеры</div>
          </div>
          <div class="nav-item active" onclick="showEquipmentView()">
            <div class="nav-icon">🔧</div>
            <div class="nav-label">Оборудование</div>
          </div>
          <div class="nav-item" onclick="showProfileView()">
            <div class="nav-icon">👤</div>
            <div class="nav-label">Профиль</div>
          </div>
        </div>
      `;
    }

    // Profile View
    function showProfileView() {
      document.getElementById('app').innerHTML = `
        <div class="app-header">
          <div class="header-title">Профиль</div>
          <div class="header-subtitle">Личные данные</div>
        </div>
        <div class="main-content">
          <div class="card">
            <div class="card-header">
              <div class="card-title">Информация</div>
            </div>
            <div class="card-body">
              <div><strong>Email:</strong> ${currentUser?.email || 'Не указан'}</div>
              <div><strong>ID:</strong> ${currentUser?.id || 'Не указан'}</div>
            </div>
          </div>
          <button class="btn btn-secondary" onclick="handleLogout()">
            Выйти
          </button>
        </div>
        <div class="bottom-nav">
          <div class="nav-item" onclick="showRequestsView()">
            <div class="nav-icon">📋</div>
            <div class="nav-label">Заявки</div>
          </div>
          <div class="nav-item" onclick="showEngineersView()">
            <div class="nav-icon">👷</div>
            <div class="nav-label">Инженеры</div>
          </div>
          <div class="nav-item" onclick="showEquipmentView()">
            <div class="nav-icon">🔧</div>
            <div class="nav-label">Оборудование</div>
          </div>
          <div class="nav-item active" onclick="showProfileView()">
            <div class="nav-icon">👤</div>
            <div class="nav-label">Профиль</div>
          </div>
        </div>
      `;
    }

    async function handleLogout() {
      await supabase.auth.signOut();
      currentUser = null;
      showAuthView();
    }

    // Start App
    initApp();
  </script>
</body>
</html>
