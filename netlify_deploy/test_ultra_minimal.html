<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="telegram-web-app" content="yes">
  <meta http-equiv="X-Frame-Options" content="ALLOWALL">
  <meta http-equiv="Content-Security-Policy" content="frame-ancestors 'self' https://web.telegram.org https://telegram.org https://*.telegram.org https://t.me https://*.t.me;">
  <title>Ultra Minimal</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: system-ui, Arial, sans-serif; padding: 20px; }
    .ok { color: #2e7d32; }
    .err { color: #c62828; }
  </style>
  <!-- cache-bust -->
</head>
<body>
  <h1>Ultra Minimal Test</h1>
  <div id="status">Checking Telegram.WebApp…</div>
  <script>
    (function(){
      try {
        if (window.Telegram && window.Telegram.WebApp) {
          const tg = window.Telegram.WebApp;
          tg.ready();
          tg.expand();
          document.getElementById('status').innerHTML = '<span class="ok">Telegram.WebApp detected</span>';
          tg.MainButton.setText('Close');
          tg.MainButton.show();
          tg.MainButton.onClick(() => tg.close());
        } else {
          document.getElementById('status').innerHTML = '<span class="err">Telegram.WebApp NOT available</span>';
        }
      } catch (e) {
        document.getElementById('status').innerText = 'Init error: ' + (e && e.message ? e.message : e);
      }
    })();
  </script>
</body>
</html>
