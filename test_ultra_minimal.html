<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra Minimal Test</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <h1>✅ ULTRA MINIMAL TEST</h1>
  <p>Если ты видишь это - Telegram WebView работает!</p>
  <div id="info"></div>
  
  <script>
    setTimeout(function() {
      if (window.Telegram && window.Telegram.WebApp) {
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        document.getElementById('info').innerHTML = '<p>✅ Telegram WebApp API работает!</p>';
      } else {
        document.getElementById('info').innerHTML = '<p>❌ Telegram WebApp API не найден</p>';
      }
    }, 100);
  </script>
</body>
</html>
