name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Prepare deployment directory
        run: |
          mkdir -p _site
          
          # Copy ONLY lightweight HTML version
          cp index.html _site/
          
          # Copy supporting files if they exist
          [ -f manifest.json ] && cp manifest.json _site/ || true
          [ -f favicon.png ] && cp favicon.png _site/ || true
          [ -d icons ] && cp -r icons _site/ || true
          
          # Add .nojekyll to prevent Jekyll processing
          touch _site/.nojekyll
          
          # Create cache-busting file
          echo "$(date +%s)" > _site/version.txt
          
          echo "✅ Deployment directory prepared:"
          ls -la _site/
          echo "📄 index.html size:"
          wc -c < _site/index.html
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
