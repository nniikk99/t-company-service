<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="T-Company Service Mini App">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="T-Company Service">
  <meta name="telegram-web-app" content="true">
  <meta name="telegram-web-app-version" content="9.1">
  <meta http-equiv="X-Frame-Options" content="ALLOWALL">
  <meta http-equiv="Content-Security-Policy" content="frame-ancestors 'self' https://*.telegram.org https://web.telegram.org https://*.t.me https://t.me;">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>T-Company Service</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Fix for Telegram Mini App scrolling - Fullscreen mode */
    html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
    }
    
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      /* Prevent bounce scrolling that collapses app */
      overscroll-behavior-y: none;
      overscroll-behavior: none;
      /* Prevent pull-to-refresh */
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }
    
    /* Flutter app container */
    flt-glass-pane {
      height: 100vh !important;
      width: 100% !important;
      overflow: hidden !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
    }
    
    /* Disable all bounce effects */
    * {
      overscroll-behavior: none !important;
    }
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="flutter.js" defer></script>
  <script>
    const serviceWorkerVersion = "4233300523";
    // Force HTML renderer for Telegram Mini App compatibility
    window.flutterWebRenderer = "html";
  </script>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
  <script>
    // Fix for Flutter 3.35.5 and Telegram Mini Apps
    window.addEventListener('load', function() {
      // Ensure hash routing works for Telegram
      const currentUrl = window.location.href;
      if (!currentUrl.includes('#/') && currentUrl.includes('#')) {
        window.history.replaceState(null, '', currentUrl.split('#')[0] + '#/');
      }
      
      // Telegram WebApp initialization
      if (window.Telegram && window.Telegram.WebApp) {
        try {
          const tg = window.Telegram.WebApp;
          tg.ready();
          
          // CRITICAL: Expand app to fullscreen mode (prevents collapse on scroll)
          tg.expand();
          
          // Set header color to match theme
          tg.setHeaderColor('#ffffff');
          
          // Disable vertical swipe gestures that cause app collapse
          if (tg.disableVerticalSwipes) {
            tg.disableVerticalSwipes();
          }
          
          // Hide back button if exists
          if (tg.BackButton && tg.BackButton.hide) {
            tg.BackButton.hide();
          }
          
          // Hide settings button
          if (tg.SettingsButton && tg.SettingsButton.hide) {
            tg.SettingsButton.hide();
          }
          
          // Enable closing confirmation
          if (tg.enableClosingConfirmation) {
            tg.enableClosingConfirmation();
          }
          
          console.log('✅ Telegram WebApp initialized successfully');
          console.log('📏 Viewport height:', tg.viewportHeight);
          
          // Set theme colors
          document.body.style.backgroundColor = tg.themeParams.bg_color || '#ffffff';
          document.body.style.color = tg.themeParams.text_color || '#000000';
        } catch (error) {
          console.error('❌ Telegram WebApp init error:', error);
        }
      }
      
      // Hide loading when Flutter is ready
      window.addEventListener('flutter-first-frame', function() {
        const loading = document.getElementById('loading');
        if (loading) {
          loading.style.display = 'none';
        }
      });
    });
  </script>
  <script type="text/javascript">
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
</head>
<body>
  <div class="container" style="display:none">
    <h1>T-company</h1>
    <h2>60T</h2>
    <p>МИНИ-ПРИЛОЖЕНИЕ</p>
  </div>
  <div id="loading">
    <style>
      body {
        background-color: var(--tg-theme-bg-color, #ffffff);
        color: var(--tg-theme-text-color, #000000);
      }
      #loading {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
      }
    </style>
    <div>Loading...</div>
  </div>
  <script>
    // Инициализация Telegram WebApp с проверкой
    window.addEventListener('DOMContentLoaded', function() {
      if (window.Telegram && window.Telegram.WebApp) {
        try {
          const tg = window.Telegram.WebApp;
          tg.ready();
          tg.expand();
          console.log('Telegram WebApp initialized successfully');
        } catch (error) {
          console.error('Telegram WebApp init error:', error);
        }
      }
    });
  </script>
</body>
</html>
